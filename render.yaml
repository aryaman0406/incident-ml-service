services:
  - type: web
    name: incident-ml-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_API_KEY
        sync: false
      - key: DISABLE_DOCS
        value: "1"
      - key: MAX_CONCURRENT
        value: "1"
